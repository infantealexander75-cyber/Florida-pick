name: Actualizar resultados

on:
  schedule:
    - cron: '*/15 17-20 * * *'
    - cron: '*/15 1-4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: resultados
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Leer resultados
        run: python3 actualizar_results.py
      - name: Guardar si hay sorteos nuevos
        run: |
          if [ -n "$(git status --porcelain results.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add results.json
            git commit -m "Resultados actualizados"
            git push
          fi
